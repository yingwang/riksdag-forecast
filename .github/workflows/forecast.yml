name: forecast
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: forecast
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - run: python tests/test_seats.py
      - run: python -m riksdag.run
      - name: commit results
        run: |
          git config user.name "Ying Wang"
          git config user.email "xingqiwang@gmail.com"
          git add -A
          git commit -m "forecast $(date -u '+%Y-%m-%d %H:%M UTC')" || exit 0
          git push
